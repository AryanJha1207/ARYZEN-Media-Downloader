<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="ARYZEN Media Downloader - download videos and audio right from the page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030714"/>
      <stop offset=".55" stop-color="#081030"/>
      <stop offset="1" stop-color="#150b38"/>
    </linearGradient>
    <radialGradient id="cy"><stop offset="0" stop-color="#22d3ee" stop-opacity=".85"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="bl"><stop offset="0" stop-color="#2563eb" stop-opacity=".9"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <radialGradient id="vi"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".85"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#3b82f6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity=".40"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".11"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".80"/>
      <stop offset=".35" stop-color="#7dd3fc" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#a78bfa" stop-opacity=".24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".60"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#67e8f9"/>
      <stop offset=".7" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="frame"><rect width="1280" height="440" rx="36"/></clipPath>
    <clipPath id="panel"><rect x="60" y="50" width="1160" height="340" rx="44"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bg)"/>

    <!-- liquid light blobs -->
    <circle cx="190" cy="80" r="320" fill="url(#cy)"/>
    <circle cx="660" cy="470" r="360" fill="url(#bl)"/>
    <circle cx="1110" cy="90" r="320" fill="url(#vi)"/>

    <!-- liquid waves behind the glass -->
    <path d="M0 330 C 200 270, 380 410, 640 350 S 1060 280, 1280 340 V440 H0 Z" fill="url(#wave)"/>
    <path d="M0 372 C 240 330, 420 430, 700 384 S 1100 330, 1280 380 V440 H0 Z" fill="url(#wave)" opacity=".55"/>

    <!-- glass panel -->
    <rect x="60" y="50" width="1160" height="340" rx="44" fill="url(#glass)"/>
    <g clip-path="url(#panel)">
      <ellipse cx="420" cy="48" rx="560" ry="96" fill="#ffffff" opacity=".09"/>
      <ellipse cx="1040" cy="400" rx="380" ry="70" fill="#a78bfa" opacity=".10"/>
    </g>
    <rect x="60.75" y="50.75" width="1158.5" height="338.5" rx="43.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <rect x="66" y="56" width="1148" height="328" rx="38" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
    <rect x="130" y="53" width="1020" height="2" rx="1" fill="url(#spec)"/>

    <!-- glints -->
    <circle cx="112" cy="104" r="3.2" fill="#ffffff" opacity=".9" filter="url(#soft)"/>
    <circle cx="1168" cy="336" r="3.2" fill="#ffffff" opacity=".7" filter="url(#soft)"/>

    <!-- wordmark -->
    <text x="640" y="182" text-anchor="middle" font-family="-apple-system,'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="108" font-weight="800" letter-spacing="16" fill="url(#title)" filter="url(#glow)">ARYZEN</text>
    <text x="640" y="228" text-anchor="middle" font-family="-apple-system,'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" letter-spacing="14" fill="#dbeafe" opacity=".92">MEDIA DOWNLOADER</text>
    <text x="640" y="268" text-anchor="middle" font-family="-apple-system,'SF Pro Text','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#9fb6e3">Download videos and audio right from the page. One glass button, seven sites.</text>

    <!-- site chips -->
    <g font-family="-apple-system,'SF Pro Text','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#e0f2fe" text-anchor="middle">
      <rect x="192" y="296" width="113" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".28"/><text x="248.5" y="319">YouTube</text>
      <rect x="319" y="296" width="135" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".28"/><text x="386.5" y="319">Instagram</text>
      <rect x="468" y="296" width="102" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".28"/><text x="519" y="319">Reddit</text>
      <rect x="584" y="296" width="102" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".28"/><text x="635" y="319">Twitch</text>
      <rect x="700" y="296" width="146" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".28"/><text x="773" y="319">SoundCloud</text>
      <rect x="860" y="296" width="146" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".28"/><text x="933" y="319">Streamable</text>
      <rect x="1020" y="296" width="69" height="36" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".28"/><text x="1054.5" y="319">TED</text>
    </g>

    <text x="640" y="366" text-anchor="middle" font-family="-apple-system,'SF Pro Text','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="3" fill="#9fb6e3" opacity=".7">BY ARYZEN NEX  ·  POWERED BY YT-DLP + FFMPEG  ·  100% LOCAL</text>
  </g>
</svg>
