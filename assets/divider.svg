<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="28" viewBox="0 0 1280 28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".3" stop-color="#22d3ee" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#818cf8" stop-opacity=".95"/>
      <stop offset=".7" stop-color="#a855f7" stop-opacity=".7"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bead" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#7dd3fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity=".35"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="60" y="13" width="1160" height="2" rx="1" fill="url(#line)"/>
  <circle cx="640" cy="14" r="7" fill="url(#bead)" stroke="#ffffff" stroke-opacity=".6" filter="url(#glow)"/>
</svg>
