<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" role="img" aria-label="The extension talks to a local bridge through native messaging. The bridge runs yt-dlp and FFmpeg, and the file is saved to your Downloads folder.">
  <style>
    .sans { font-family: 'Host Grotesk', Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="879" height="167" rx="16" fill="#0a0d14" stroke="#2a3347"/>
  <rect x="20.5" y="20.5" width="179" height="127" rx="12" fill="#131824" stroke="#2a3347"/>
  <rect x="34" y="21" width="152" height="1" fill="url(#edge)"/>
  <text class="mono" x="36" y="50" font-size="12" fill="#5ab9fc">01</text>
  <text class="sans" x="36" y="76" font-size="16" font-weight="600" fill="#e9edf3">Extension</text>
  <text class="sans" x="36" y="100" font-size="12.5" fill="#8891a1">Download button and</text>
  <text class="sans" x="36" y="117" font-size="12.5" fill="#8891a1">quality picker, on the</text>
  <text class="sans" x="36" y="134" font-size="12.5" fill="#8891a1">video page</text>
  <path d="M209 84.0 H231 M225 79.0 L231 84.0 L225 89.0" fill="none" stroke="#5ab9fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="240.5" y="20.5" width="179" height="127" rx="12" fill="#131824" stroke="#2a3347"/>
  <rect x="254" y="21" width="152" height="1" fill="url(#edge)"/>
  <text class="mono" x="256" y="50" font-size="12" fill="#5ab9fc">02</text>
  <text class="sans" x="256" y="76" font-size="16" font-weight="600" fill="#e9edf3">Local bridge</text>
  <text class="sans" x="256" y="100" font-size="12.5" fill="#8891a1">bridge/umd_host.py,</text>
  <text class="sans" x="256" y="117" font-size="12.5" fill="#8891a1">reached by native</text>
  <text class="sans" x="256" y="134" font-size="12.5" fill="#8891a1">messaging. No shell.</text>
  <path d="M429 84.0 H451 M445 79.0 L451 84.0 L445 89.0" fill="none" stroke="#5ab9fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="460.5" y="20.5" width="179" height="127" rx="12" fill="#131824" stroke="#2a3347"/>
  <rect x="474" y="21" width="152" height="1" fill="url(#edge)"/>
  <text class="mono" x="476" y="50" font-size="12" fill="#5ab9fc">03</text>
  <text class="sans" x="476" y="76" font-size="16" font-weight="600" fill="#e9edf3">yt-dlp + FFmpeg</text>
  <text class="sans" x="476" y="100" font-size="12.5" fill="#8891a1">yt-dlp fetches the</text>
  <text class="sans" x="476" y="117" font-size="12.5" fill="#8891a1">media. FFmpeg merges</text>
  <text class="sans" x="476" y="134" font-size="12.5" fill="#8891a1">and makes the MP3.</text>
  <path d="M649 84.0 H671 M665 79.0 L671 84.0 L665 89.0" fill="none" stroke="#5ab9fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="680.5" y="20.5" width="179" height="127" rx="12" fill="#131824" stroke="#2a3347"/>
  <rect x="694" y="21" width="152" height="1" fill="url(#edge)"/>
  <text class="mono" x="696" y="50" font-size="12" fill="#5ab9fc">04</text>
  <text class="sans" x="696" y="76" font-size="16" font-weight="600" fill="#e9edf3">Your files</text>
  <text class="sans" x="696" y="100" font-size="12.5" fill="#8891a1">Saved to</text>
  <text class="sans" x="696" y="117" font-size="12.5" fill="#8891a1">~/Downloads/UMD</text>
</svg>
