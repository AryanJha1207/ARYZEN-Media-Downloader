
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 880 148">
  <rect width="880" height="148" rx="18" fill="#0b0e14" stroke="#29364d"/>

  <defs>
    <style>
      .tile { fill: #e9edf3; }
      .label {
        fill: #f1f3f7;
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: 600;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- YouTube -->
  <g transform="translate(104 62)">
    <rect class="tile" x="-36" y="-36" width="72" height="72" rx="16"/>
    <rect x="-22" y="-15" width="44" height="30" rx="9" fill="#ff0000"/>
    <path d="M-5 -8 L10 0 L-5 8Z" fill="white"/>
    <text class="label" y="62">YouTube</text>
  </g>

  <!-- Instagram -->
  <g transform="translate(238 62)">
    <rect class="tile" x="-36" y="-36" width="72" height="72" rx="16"/>
    <rect x="-18" y="-18" width="36" height="36" rx="11"
          fill="none" stroke="#111" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#111" stroke-width="3.5"/>
    <circle cx="12" cy="-12" r="2.5" fill="#111"/>
    <text class="label" y="62">Instagram</text>
  </g>

  <!-- Reddit -->
  <g transform="translate(373 62)">
    <rect class="tile" x="-36" y="-36" width="72" height="72" rx="16"/>
    <circle r="20" fill="#ff4500"/>
    <path d="M-11 1 Q-12 -8 0 -8 Q12 -8 11 1 Q12 10 0 11 Q-12 10 -11 1Z"
          fill="white"/>
    <circle cx="-6" cy="0" r="2" fill="#ff4500"/>
    <circle cx="6" cy="0" r="2" fill="#ff4500"/>
    <path d="M-5 5 Q0 9 5 5" fill="none" stroke="#ff4500" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M2 -8 L5 -17 L13 -14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <circle cx="14" cy="-14" r="2" fill="white"/>
    <text class="label" y="62">Reddit</text>
  </g>

  <!-- Spotify -->
  <g transform="translate(507 62)">
    <rect class="tile" x="-36" y="-36" width="72" height="72" rx="16"/>
    <circle r="21" fill="#1ed760"/>
    <g fill="none" stroke="#101010" stroke-linecap="round">
      <path d="M-12 -7 Q1 -12 13 -5" stroke-width="3.5"/>
      <path d="M-11 0 Q1 -4 11 2" stroke-width="3"/>
      <path d="M-9 7 Q1 5 9 10" stroke-width="2.5"/>
    </g>
    <text class="label" y="62">Spotify</text>
  </g>

  <!-- Twitch -->
  <g transform="translate(642 62)">
    <rect class="tile" x="-36" y="-36" width="72" height="72" rx="16"/>
    <path d="M-17 -18 H17 V7 L5 19 H-4 L-12 27 V19 H-17Z"
          fill="none" stroke="#111" stroke-width="4"/>
    <path d="M-6 -10 V3 M5 -10 V3" stroke="#111" stroke-width="4"/>
    <text class="label" y="62">Twitch</text>
  </g>

  <!-- SoundCloud -->
  <g transform="translate(776 62)">
    <rect class="tile" x="-36" y="-36" width="72" height="72" rx="16"/>
    <path d="M-21 5 V-1 M-17 7 V-5 M-13 7 V-9 M-9 7 V-13
             M-5 7 V-16 M-1 7 V-19 M3 7 V-17
             M7 7 V-13 M11 7 V-9 M15 7 V-4
             M-21 7 H17 Q23 7 23 1 Q23 -5 16 -5
             Q14 -17 4 -17 Q-7 -17 -9 -6
             Q-18 -7 -18 0 Q-23 1 -21 7Z"
          fill="#ff5500"/>
    <text x="0" y="15" font-family="Arial" font-size="5"
          font-weight="bold" text-anchor="middle" fill="#ff5500">SOUNDCLOUD</text>
    <text class="label" y="62">SoundCloud</text>
  </g>
