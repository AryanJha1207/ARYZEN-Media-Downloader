<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="270" viewBox="0 0 1280 270" role="img" aria-label="Features: one-click download, quality picker, MP3 conversion, local and private">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030714"/><stop offset=".6" stop-color="#081030"/><stop offset="1" stop-color="#150b38"/>
    </linearGradient>
    <radialGradient id="cy"><stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="vi"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".7"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".55" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity=".09"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".4" stop-color="#7dd3fc" stop-opacity=".15"/><stop offset=".75" stop-color="#a78bfa" stop-opacity=".2"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ico" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1280" height="270" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="270" fill="url(#bg)"/>
    <circle cx="140" cy="20" r="260" fill="url(#cy)"/>
    <circle cx="1160" cy="260" r="280" fill="url(#vi)"/>
    <path d="M0 215 C 260 170, 460 270, 700 225 S 1060 180, 1280 225 V270 H0 Z" fill="#3b82f6" opacity=".10"/>

    <g font-family="-apple-system,'SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="middle">
      <!-- card 1 -->
      <rect x="30" y="30" width="290" height="210" rx="30" fill="url(#glass)"/>
      <rect x="30.75" y="30.75" width="288.5" height="208.5" rx="29.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
      <rect x="70" y="32" width="210" height="2" rx="1" fill="url(#spec)"/>
      <circle cx="175" cy="86" r="30" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".3"/>
      <g transform="translate(175 86)" fill="none" stroke="url(#ico)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <path d="M0 -13 V7 M-9 -2 L0 7 L9 -2"/><path d="M-13 14 H13"/>
      </g>
      <text x="175" y="152" font-size="22" font-weight="700" fill="#fff">One-click download</text>
      <text x="175" y="181" font-size="14" fill="#9fb6e3">A floating glass button appears</text>
      <text x="175" y="201" font-size="14" fill="#9fb6e3">right on the supported site.</text>

      <!-- card 2 -->
      <rect x="340" y="30" width="290" height="210" rx="30" fill="url(#glass)"/>
      <rect x="340.75" y="30.75" width="288.5" height="208.5" rx="29.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
      <rect x="380" y="32" width="210" height="2" rx="1" fill="url(#spec)"/>
      <circle cx="485" cy="86" r="30" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".3"/>
      <g transform="translate(485 86)" fill="none" stroke="url(#ico)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <path d="M-13 -10 H13 M-13 0 H13 M-13 10 H13"/>
        <circle cx="-5" cy="-10" r="3.6" fill="#0b1030"/><circle cx="6" cy="0" r="3.6" fill="#0b1030"/><circle cx="-2" cy="10" r="3.6" fill="#0b1030"/>
      </g>
      <text x="485" y="152" font-size="22" font-weight="700" fill="#fff">Pick your quality</text>
      <text x="485" y="181" font-size="14" fill="#9fb6e3">Choose from the real quality</text>
      <text x="485" y="201" font-size="14" fill="#9fb6e3">ladder, 1080p down to 180p.</text>

      <!-- card 3 -->
      <rect x="650" y="30" width="290" height="210" rx="30" fill="url(#glass)"/>
      <rect x="650.75" y="30.75" width="288.5" height="208.5" rx="29.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
      <rect x="690" y="32" width="210" height="2" rx="1" fill="url(#spec)"/>
      <circle cx="795" cy="86" r="30" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".3"/>
      <g transform="translate(795 86)" fill="none" stroke="url(#ico)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <circle cx="-6" cy="11" r="5"/><path d="M-1 11 V-12 L12 -8"/>
      </g>
      <text x="795" y="152" font-size="22" font-weight="700" fill="#fff">MP3, your way</text>
      <text x="795" y="181" font-size="14" fill="#9fb6e3">Audio-only downloads converted</text>
      <text x="795" y="201" font-size="14" fill="#9fb6e3">to MP3 at several bitrates.</text>

      <!-- card 4 -->
      <rect x="960" y="30" width="290" height="210" rx="30" fill="url(#glass)"/>
      <rect x="960.75" y="30.75" width="288.5" height="208.5" rx="29.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
      <rect x="1000" y="32" width="210" height="2" rx="1" fill="url(#spec)"/>
      <circle cx="1105" cy="86" r="30" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".3"/>
      <g transform="translate(1105 86)" fill="none" stroke="url(#ico)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <path d="M0 -14 L12 -9 V2 C12 9 6 13 0 16 C-6 13 -12 9 -12 2 V-9 Z"/><path d="M-5 1 L-1 5 L6 -4"/>
      </g>
      <text x="1105" y="152" font-size="22" font-weight="700" fill="#fff">Local and private</text>
      <text x="1105" y="181" font-size="14" fill="#9fb6e3">No accounts, no servers, no</text>
      <text x="1105" y="201" font-size="14" fill="#9fb6e3">tracking. Runs on your machine.</text>
    </g>
  </g>
</svg>
